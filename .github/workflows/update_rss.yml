name: Update RSS Feed

on:
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут
  workflow_dispatch:        # Для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install feedparser requests beautifulsoup4

    - name: Run RSS merger
      run: python rss_merger.py

    - name: Commit and push updated XML file
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add merged_feed.xml
        git diff --staged --quiet || git commit -m "Обновлен RSS-файл [skip ci]"
        git push https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
