name: Update RSS Feed

# Разрешаем скрипту записывать файлы в репозиторий
permissions: write-all

on:
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут
  workflow_dispatch:        # Для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Загружаем код из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Устанавливаем нужные библиотеки
    - name: Install dependencies
      run: |
        pip install feedparser requests beautifulsoup4

    # 4. Запускаем скрипт, который создаёт merged_feed.xml
    - name: Run RSS merger
      run: python rss_merger.py

    # 5. Сохраняем созданный файл в репозиторий
    - name: Commit and push updated XML file
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add merged_feed.xml
        git diff --quiet && git diff --staged --quiet || git commit -m "Обновлен RSS-файл"
        git push
